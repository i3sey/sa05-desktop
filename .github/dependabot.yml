version: 2

updates:
  # Xray-core is pinned by build/vendor-xray.sh, not by go.mod, so it is deliberately
  # outside Dependabot's reach: bumping the core is a decision that needs the Beeline
  # patch re-verified against the new tree.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
