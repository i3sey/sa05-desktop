name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для ручной сборки (например v0.1.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  linux:
    name: Сборка (Linux amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Версия
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Вендоринг Xray-core
        run: build/vendor-xray.sh

      - name: Фронтенд
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Бинарники
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/out
          flags="-w -s -X main.version=$VERSION"
          go build -tags "desktop,production,webkit2_41" -ldflags "$flags" -o build/out/sa05 ./cmd/sa05
          go build -ldflags "$flags" -o build/out/sa05ctl ./cmd/sa05ctl
          go build -ldflags "$flags" -o build/out/sa05-helper ./cmd/sa05-helper

      # Geo databases ship with the release: without them any profile using geosite: rules
      # refuses to start, and asking users to fetch 30 MB by hand is not an install.
      - name: Гео-базы
        run: build/fetch-geoassets.sh build/out/assets

      # An AppImage covers distributions without a native package: it carries the GUI, the
      # CLI and the geo databases, and needs nothing installed but WebKitGTK.
      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          build/make-appimage.sh "$VERSION"
          mkdir -p dist
          cp build/appimage/*.AppImage dist/
          ( cd dist && sha256sum *.AppImage > "$(ls *.AppImage).sha256" )

      - name: Пакет
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="sa05-$VERSION-linux-amd64"
          mkdir -p "dist/$name"
          cp -r build/out/* "dist/$name/"
          cp -r build/install-linux.sh packaging README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -lh dist

      # Every artifact is signed with the release key before it leaves the runner. The
      # client refuses an update whose signature is missing or made by another key, so an
      # unsigned release simply would not install.
      - name: Подпись
        env:
          SA05_RELEASE_KEY: ${{ secrets.SA05_RELEASE_KEY }}
        run: |
          if [ -z "$SA05_RELEASE_KEY" ]; then
            echo "SA05_RELEASE_KEY не задан: релиз без подписи не устанавливается клиентом" >&2
            exit 1
          fi
          go run ./build/sign dist/*.tar.gz dist/*.AppImage
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: sa05-linux-amd64
          path: |
            dist/*.tar.gz*
            dist/*.AppImage*
          retention-days: 14

  windows:
    name: Сборка (Windows amd64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Версия
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Вендоринг Xray-core
        shell: bash
        run: build/vendor-xray.sh

      - name: Фронтенд
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Бинарники
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/out
          flags="-w -s -X main.version=$VERSION"
          # -H windowsgui keeps a console window from opening behind the GUI.
          go build -tags "desktop,production" -ldflags "$flags -H windowsgui" -o build/out/sa05.exe ./cmd/sa05
          go build -ldflags "$flags" -o build/out/sa05ctl.exe ./cmd/sa05ctl
          go build -ldflags "$flags" -o build/out/sa05-helper.exe ./cmd/sa05-helper

      - name: Гео-базы
        shell: bash
        run: build/fetch-geoassets.sh build/out/assets

      - name: Пакет
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="sa05-$VERSION-windows-amd64"
          mkdir -p "dist/$name"
          cp -r build/out/* "dist/$name/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          ( cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null )
          ( cd dist && certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256" )
          ls -l dist

      - name: Подпись
        shell: bash
        env:
          SA05_RELEASE_KEY: ${{ secrets.SA05_RELEASE_KEY }}
        run: |
          if [ -z "$SA05_RELEASE_KEY" ]; then
            echo "SA05_RELEASE_KEY не задан: релиз без подписи не устанавливается клиентом" >&2
            exit 1
          fi
          go run ./build/sign dist/*.zip
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: sa05-windows-amd64
          path: dist/*.zip*
          retention-days: 14

  draft:
    name: Черновик релиза
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    # Only a tag produces a release; a manual run stops at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist

      # Draft, not published: the tag builds the artifacts, a human decides when they go
      # out. Publishing is one click in the releases UI.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sig
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.sig
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.sig
          body: |
            ## Linux

            ```bash
            tar -xzf sa05-${{ github.ref_name }}-linux-amd64.tar.gz
            cd sa05-${{ github.ref_name }}-linux-amd64
            sudo ./install-linux.sh
            sa05
            ```

            Без установки: скачайте `SA05-*.AppImage`, `chmod +x`, запустите. В нём нет
            системного компонента, поэтому режим TUN недоступен — работают ядро,
            системный прокси и Telegram.

            ## Windows

            Распакуйте архив и запустите `sa05.exe`. Нужен Microsoft Edge WebView2
            (в Windows 11 предустановлен). Ядро, системный прокси и Telegram работают;
            режим TUN на Windows пока не реализован.

            ---

            ## Обновления

            Клиент проверяет этот же список релизов и обновляется сам: архив
            устанавливается только если его подпись `.sig` сделана ключом разработчика.
            Установленный пакетным менеджером клиент обновляется через него.

            ---

            Клиент линкует tg-ws-proxy (GPLv3), поэтому распространяется под GPLv3;
            исходники — в этом репозитории.
