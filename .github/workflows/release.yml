name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для ручной сборки (например v0.1.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  GUI_TAGS: desktop,production,webkit2_41

jobs:
  linux:
    name: Релиз (Linux amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Версия
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Вендоринг Xray-core
        run: build/vendor-xray.sh

      - name: Фронтенд
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Бинарники
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/out
          flags="-w -s -X main.version=$VERSION"
          go build -tags "$GUI_TAGS" -ldflags "$flags" -o build/out/sa05 ./cmd/sa05
          go build -ldflags "$flags" -o build/out/sa05ctl ./cmd/sa05ctl
          go build -ldflags "$flags" -o build/out/sa05-helper ./cmd/sa05-helper

      # Geo databases ship with the release: without them any profile using geosite:
      # rules refuses to start, and asking users to fetch 30 MB by hand is not an install.
      - name: Гео-базы
        run: build/fetch-geoassets.sh build/out/assets

      - name: Пакет
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="sa05-$VERSION-linux-amd64"
          mkdir -p "dist/$name"
          cp -r build/out/* "dist/$name/"
          cp -r build/install-linux.sh packaging README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sa05-linux-amd64-release
          path: dist/*.tar.gz*

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
          body: |
            Установка:

            ```bash
            tar -xzf sa05-${{ steps.version.outputs.value }}-linux-amd64.tar.gz
            cd sa05-${{ steps.version.outputs.value }}-linux-amd64
            sudo ./install-linux.sh
            sa05
            ```

            Клиент линкует tg-ws-proxy (GPLv3), поэтому распространяется под GPLv3;
            исходники — в этом репозитории.
