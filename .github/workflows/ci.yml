name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  # Wails needs its own tags; webkit2_41 selects the WebKitGTK 4.1 API current distros ship.
  GUI_TAGS: desktop,production,webkit2_41

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The patched core is a build step, not a committed fork: it is re-fetched and
      # re-patched here, and the patch verifies itself with its own regression test.
      - name: Вендоринг Xray-core
        run: build/vendor-xray.sh

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal | grep -v 'internal/tgws/upstream/proxy.go' || true)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./internal/... ./cmd/sa05ctl ./cmd/sa05-helper

      # cmd/sa05 embeds the built frontend; it is compiled in the build job, which has
      # node. Here only the packages that stand on their own are tested.
      - name: Тесты
        run: go test -count=1 ./internal/... ./cmd/sa05ctl ./cmd/sa05-helper

  build-linux:
    name: Сборка (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Вендоринг Xray-core
        run: build/vendor-xray.sh

      - name: Фронтенд
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Бинарники
        run: |
          mkdir -p build/out
          go build -tags "$GUI_TAGS" -ldflags "-w -s" -o build/out/sa05 ./cmd/sa05
          go build -ldflags "-w -s" -o build/out/sa05ctl ./cmd/sa05ctl
          go build -ldflags "-w -s" -o build/out/sa05-helper ./cmd/sa05-helper

      - name: Проверка запуска
        run: |
          build/out/sa05ctl status
          build/out/sa05-helper -h 2>&1 | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: sa05-linux-amd64
          path: build/out/
          retention-days: 14

  build-windows:
    name: Сборка (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Вендоринг Xray-core
        shell: bash
        run: build/vendor-xray.sh

      - name: Фронтенд
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Бинарники
        shell: bash
        run: |
          mkdir -p build/out
          # -H windowsgui keeps a console window from opening behind the GUI.
          go build -tags "desktop,production" -ldflags "-H windowsgui" -o build/out/sa05.exe ./cmd/sa05
          go build -o build/out/sa05ctl.exe ./cmd/sa05ctl
          go build -o build/out/sa05-helper.exe ./cmd/sa05-helper

      - name: go vet
        shell: bash
        run: go vet ./internal/... ./cmd/sa05ctl ./cmd/sa05-helper

      - name: Тесты
        shell: bash
        run: go test -count=1 ./internal/... ./cmd/sa05ctl ./cmd/sa05-helper

      - uses: actions/upload-artifact@v4
        with:
          name: sa05-windows-amd64-ci
          path: build/out/
          retention-days: 7
